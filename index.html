<style>
:root{--tb:#3278C8;--bg:#EEF1F7;--card:#fff;--tx:#111827;--mu:#454e62;--bd:#e3e7ef;--in:#F5F7FA;--green:#16A36A;--gold:#E5A52B;--red:#DC4545;--blue:#3278C8;--navy:#111827;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0a1020;--card:#141d33;--tx:#eef2f9;--mu:#a3aec3;--bd:#26324d;--in:#0d1527}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 100% 35%,#3278c828,transparent 42%),radial-gradient(circle at 0 75%,#16a36a24,transparent 42%),radial-gradient(circle at 80% 100%,#e5a52b26,transparent 40%),var(--bg);background-attachment:fixed;color:var(--tx);font-weight:500;font-family:'Noto Sans Bengali','Hind Siliguri',sans-serif;font-size:16px;line-height:1.55;padding-bottom:96px}
header{background:linear-gradient(120deg,#0b1020,#27348b,#4c1d95,#0f3b6e,#0b1020);background-size:320% 320%;animation:hbg 16s ease infinite;color:#fff;padding:18px 18px 26px;border-radius:0 0 26px 26px}
header{position:relative;overflow:hidden}header::before{content:'';position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:#ffffff1c;animation:fl1 9s ease-in-out infinite}header::after{content:'';position:absolute;right:60px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:#f0b83e38;animation:fl2 11s ease-in-out infinite}header h1{margin:0;font-family:'Noto Serif Bengali','Noto Sans Bengali',serif;font-size:34px;font-weight:800;letter-spacing:1px;line-height:1.35;position:relative;background:linear-gradient(110deg,#8a5b00 0%,#c8900a 12%,#f6c445 26%,#fff3b0 38%,#ffd24d 50%,#b87a00 64%,#e8b11e 78%,#fff3b0 90%,#8a5b00 100%);background-size:260% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shm 4.5s linear infinite;filter:drop-shadow(0 0 8px #f7cf5a70) drop-shadow(0 2px 3px #000a)}.orn{font-style:normal;font-size:15px;vertical-align:middle;opacity:.9}.ln{height:2px;width:130px;margin:2px 0 8px;background:linear-gradient(90deg,#f0b83e,#f0b83e00);border-radius:2px;position:relative}@keyframes shm{to{background-position:200% center}}@keyframes hbg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}@keyframes fl1{50%{transform:translate(-18px,14px) scale(1.12)}}@keyframes fl2{50%{transform:translate(22px,-12px) scale(.9)}}@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.92)}100%{transform:scale(1)}}@keyframes rp{to{transform:scale(2.6);opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.b,.bt button{position:relative;overflow:hidden}.md{animation:up .28s ease}.dc,.rw,.hero,.gc,.tl a{animation:fi .45s ease both}.pr{animation:pop .28s ease!important}.rp{position:absolute;border-radius:50%;background:#ffffff70;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}.sp{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--spk,#ffe27a);box-shadow:0 0 8px 2px var(--spg,#f7cf5a);opacity:0;animation:tw 3.2s ease-in-out infinite}.mu{position:absolute;top:12px;right:14px;z-index:3;border:0;border-radius:50%;width:34px;height:34px;background:#ffffff26;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:16px;padding:0}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}.sb{font-weight:700;opacity:.95;position:relative}header small{opacity:.8;font-weight:600;position:relative}
main{padding:14px;max-width:820px;margin:-14px auto 0}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.dc small{font-size:15px;font-weight:700;position:relative;z-index:1}.dc b{font-size:clamp(22px,6.8vw,29px);line-height:1.25;font-weight:800;position:relative;z-index:1}.dc::before{content:'';position:absolute;right:-24px;top:-24px;width:96px;height:96px;border-radius:50%;background:#ffffff2e}.dc::after{content:'';position:absolute;right:30px;bottom:-38px;width:76px;height:76px;border-radius:50%;background:#ffffff1a}

.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hs div{background:#fff2;border-radius:12px;padding:8px;font-size:12px}.hs b{display:block;font-size:15px}.hs.h4{grid-template-columns:repeat(2,1fr)}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:14px 0 6px}.tabs a{flex:1;text-align:center;padding:9px;border-radius:11px;font-weight:600;color:var(--mu);cursor:pointer}.tabs a.on{background:var(--navy);color:#fff}

/* ===== ড্র্যাগ করে হিসাব সাজানো ===== */
(function(){let D=null,tm=0;
function mv(){if(!D)return;const{row,box,rows,g,i0}=D,dy=D.cy-D.y0+(box.scrollTop-D.s0);row.style.transform='translateY('+dy+'px)';
const c=g[i0].t+g[i0].h/2+dy;let k=0;for(let j=0;j<rows.length;j++){if(j!=i0&&g[j].t+g[j].h/2<c)k++}
D.k=k;const sh=g[i0].h+D.gap;
rows.forEach((r,j)=>{if(j==i0)return;let y=0;if(k>i0&&j>i0&&j<=k)y=-sh;else if(k<i0&&j>=k&&j<i0)y=sh;r.style.transform=y?'translateY('+y+'px)':''})}
function scr(){if(!D)return;const b=D.box.getBoundingClientRect();let d=0;if(D.cy<b.top+46)d=-12;else if(D.cy>b.bottom-46)d=12;if(d){const o=D.box.scrollTop;D.box.scrollTop+=d;if(D.box.scrollTop!=o)mv()}}
function end(ok){if(!D)return;const{row,box,rows,i0,k}=D;clearInterval(tm);const key=box.dataset.ok,top=box.scrollTop,pg=window.scrollY;
rows.forEach(r=>{r.style.transform=''});row.classList.remove('dragging');box.classList.remove('dragon');
const ids=rows.map(r=>r.dataset.id),moved=ok&&k!==i0&&key;D=null;
if(moved){const id=ids.splice(i0,1)[0];ids.splice(k,0,id);S.ord=S.ord||{};S.ord[key]=ids;sv();try{sfx('tap')}catch(e){}R();const nbx=document.querySelector('[data-ok="'+key+'"]');if(nbx)nbx.scrollTop=top;try{window.scrollTo(0,pg)}catch(e){}}}
document.addEventListener('pointerdown',e=>{if(D)return;const h=e.target.closest&&e.target.closest('.dgh');if(!h)return;const row=h.closest('.rw'),box=row&&row.parentNode;if(!box||!box.dataset.ok)return;e.preventDefault();e.stopPropagation();
const rows=[...box.children].filter(x=>x.classList.contains('rw')&&x.dataset.id),i0=rows.indexOf(row);if(i0<0)return;
box.classList.add('dragon');const br=box.getBoundingClientRect(),g=rows.map(r=>{const q=r.getBoundingClientRect();return{t:q.top-br.top+box.scrollTop,h:q.height}});
D={row,box,rows,i0,k:i0,g,gap:g.length>1?Math.max(0,g[1].t-(g[0].t+g[0].h)):0,y0:e.clientY,cy:e.clientY,s0:box.scrollTop};
row.classList.add('dragging');row.style.transform='translateY(0px)';try{h.setPointerCapture(e.pointerId)}catch(x){}tm=setInterval(scr,30);try{if(ST.vib&&navigator.vibrate)navigator.vibrate(10)}catch(x){}},true);
document.addEventListener('pointermove',e=>{if(!D)return;e.preventDefault();D.cy=e.clientY;mv()},{passive:false});
document.addEventListener('pointerup',()=>end(1));document.addEventListener('pointercancel',()=>end(0));
})();
